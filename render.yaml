# Render Blueprint (docs/BLUEPRINT.md §21). Deploy via
# https://dashboard.render.com/blueprints -> point at this repo. Render
# auto-detects this file at the repo root; each service's `rootDir` below
# tells it where that service's code lives in this monorepo.
#
# No persistent disk: Render's free tier doesn't support one. SQLite
# lives on the free-tier instance's ephemeral local disk, so the DB
# resets on every redeploy/restart - acceptable for a mock-interview demo
# app where sessions are practice runs, not permanent records. Upgrade to
# a paid plan and add a `disk:` block (see git history), or migrate to
# Postgres (§21), if you need data to persist.
services:
  - type: web
    name: intervue-ai-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Baked into the client bundle at build time - update this and
      # redeploy if the backend's URL ever changes.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://intervue-ai-backend-yjez.onrender.com/api/v1
  - type: web
    name: intervue-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_prod.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/intervue.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "15.0"
      - key: GEMINI_MAX_RETRIES
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_SESSION_DURATION_MINUTES
        value: "60"
      - key: MAX_QUESTIONS_PER_SESSION
        value: "40"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
