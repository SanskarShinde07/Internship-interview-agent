# Render Blueprint (docs/BLUEPRINT.md §21). Deploy via
# https://dashboard.render.com/blueprints -> point at this repo. Render
# auto-detects this file at the repo root; `rootDir: backend` below tells
# it where the actual service code lives in this monorepo. A persistent
# disk keeps the SQLite file across deploys/restarts; migrate to Postgres
# (see §21) if you outgrow it.
services:
  - type: web
    name: intervue-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_prod.sh
    disk:
      name: intervue-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/data/intervue.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "15.0"
      - key: GEMINI_MAX_RETRIES
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_SESSION_DURATION_MINUTES
        value: "60"
      - key: MAX_QUESTIONS_PER_SESSION
        value: "40"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
